<!DOCTYPE html>
<html lang="es">
<head>
{{> head-inicio}}
{{#if produccion}}
  <meta name="robots" content="noindex, nofollow">
{{/if}}
  <title>Página no encontrada | {{negocio.nombre}}</title>
  <meta name="description" content="La página que buscas no existe. Vuelve al inicio de {{negocio.nombre}} para consultar los servicios y reservar tu cita.">
  <base href="/">
{{> head-fin}}
</head>
<body>
<main class="notfound">
  <a class="brand" href="index.html" aria-label="{{negocio.nombre}}, volver al inicio"><span class="brand__name">{{negocio.marca}}</span></a>
  <h1 class="legal__title">Esta página no existe</h1>
  <p class="section-note">Puede que el enlace esté roto o que la página se haya movido.</p>
  <a class="btn" href="index.html">Ir al inicio</a>
</main>
</body>
</html>
