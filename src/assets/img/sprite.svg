<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Marca: flor de azahar. Pétalos y trazo heredan color (variable CSS petal). -->
  <symbol id="azahar" viewBox="-24 -24 48 48">
    <g fill="var(--petal, #FBF6EA)" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
      <ellipse cx="0" cy="-11" rx="7" ry="11"/>
      <ellipse cx="0" cy="-11" rx="7" ry="11" transform="rotate(72)"/>
      <ellipse cx="0" cy="-11" rx="7" ry="11" transform="rotate(144)"/>
      <ellipse cx="0" cy="-11" rx="7" ry="11" transform="rotate(216)"/>
      <ellipse cx="0" cy="-11" rx="7" ry="11" transform="rotate(288)"/>
    </g>
    <circle r="4.4" fill="#F2B63B" stroke="currentColor" stroke-width="1.2"/>
  </symbol>

  <!-- Iconos de trazo (24x24) -->
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 10h17M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-whatsapp" viewBox="0 0 24 24"><path d="M12 3.2a8.7 8.7 0 0 0-7.5 13.1L3.3 20.7l4.5-1.2A8.7 8.7 0 1 0 12 3.2Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 8.6c.2-.4.5-.4.8-.4l.5.9c0 .3-.4.7-.6 1 .6 1.2 1.5 2 2.8 2.6.3-.3.6-.9 1-.9l1 .5c0 .4-.1.8-.5 1.1-.5.4-1.2.5-2 .2-2.3-.9-4-2.6-4.6-4.1-.2-.5-.1-.7.1-.9Z" fill="currentColor"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M5 4.5h3.3l1.5 4-2 1.3a11 11 0 0 0 5.4 5.4l1.3-2 4 1.5V18a2 2 0 0 1-2 2A14.5 14.5 0 0 1 3 6.5a2 2 0 0 1 2-2Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.4" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 8h16M4 16h16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
