# Netlify: compila las plantillas de src/ con site.config.mjs y publica la carpeta `dist/`.
#   · Build:      node scripts/build.mjs  (sin dependencias; la UNICA carpeta que se publica es `dist`)
#   · Demo/producción: lo decide `modoDemo` en site.config.mjs (true = noindex y robots Disallow; false = indexable con sitemap)
#   · SITE_URL no hace falta en modo demo: Netlify aporta la variable URL con la dirección pública del sitio.
[build]
  command = "node scripts/build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--omit=dev"   # las herramientas de test (Playwright, html-validate) no se instalan en el despliegue

# Cabeceras de seguridad. No se define Content-Security-Policy porque el calendario de Cal.com
# no se ha podido probar contra una política concreta desde el entorno de desarrollo.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# CSS y JS llevan ?v=<hash> en la URL, así que pueden cachearse de forma permanente.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"


# Las imágenes no llevan caché larga a propósito: las fotos provisionales se sustituirán por fotografía real
# con el mismo nombre de archivo y no debe quedar la antigua en el navegador (Netlify revalida con ETag).
