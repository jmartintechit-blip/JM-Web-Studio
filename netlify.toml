# Configuración de Netlify: web estática, sin paso de compilación.
[build]
  publish = "."

# Cabeceras de seguridad para todo el sitio
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Tipografías e imágenes: caché larga (los nombres de archivo no cambian de contenido)
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# HTML, CSS y JS se revalidan en cada visita (valor por defecto de Netlify);
# además cada enlace lleva ?v=AAAAMMDD para forzar la actualización tras un cambio.
